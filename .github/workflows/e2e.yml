# Playwright end-to-end tests against the production build and a throwaway
# PostgreSQL. The setup project (e2e/auth.setup.ts) migrates and seeds the
# `_e2e` database; see docs/testing.md.
name: E2E

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    NEXT_TELEMETRY_DISABLED: "1"

jobs:
    e2e:
        name: Playwright
        runs-on: ubuntu-latest
        timeout-minutes: 25
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: ci
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: skool_admin_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ci -d skool_admin_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # Throwaway CI database; the setup refuses anything not local and
            # not ending in `_e2e`.
            E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/skool_admin_e2e?schema=public
            # Placeholder values that only satisfy the env schema. Sign-in uses
            # a seeded session, so Google is never called. Never put real
            # secrets here. DATABASE_URL and NEXTAUTH_URL are set by
            # playwright.config.ts for the app server.
            DATABASE_URL: postgresql://ci:ci@localhost:5432/skool_admin_e2e?schema=public
            NEXTAUTH_SECRET: ci-only-placeholder-not-a-real-secret-0123456789
            NEXTAUTH_URL: http://localhost:3100
            GOOGLE_CLIENT_ID: ci-placeholder
            GOOGLE_CLIENT_SECRET: ci-placeholder
            AUTH_ALLOWED_DOMAIN: example.org
            REPORT_TEMPLATE_DOC_ID: ci-placeholder
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Upload report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
